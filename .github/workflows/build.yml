name: Build and validate VST3
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtkmm-3.0-dev libx11-dev libfreetype6-dev libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libwayland-dev wayland-protocols
      - name: Bootstrap (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh
      - name: Build and test (Unix)
        if: runner.os != 'Windows'
        run: |
          bash scripts/build.sh
          bash scripts/check.sh
      - name: Check both macOS architectures
        if: runner.os == 'macOS'
        run: lipo build/VST3/Release/BAT-transpose.vst3/Contents/MacOS/BAT-transpose -verify_arch arm64 x86_64
      - name: Bootstrap, build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build.ps1
          ./scripts/build.ps1 -Target validator -SkipTests
          ./scripts/check.ps1
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/package.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BAT-transpose-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BAT-transpose-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(BATTranspose VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test "$RELEASE_TAG" = "v$version"
          shopt -s nullglob
          assets=(release-assets/*.zip)
          test "${#assets[@]}" -eq 3
          cat > release-notes.md <<'NOTES'
          One knob, −12 to +12 semitones. VST3 for Windows, Linux, and macOS.

          Alpha version. The macOS package is not notarized.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "BAT Transpose $version Alpha" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --prerelease \
              --title "BAT Transpose $version Alpha" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false
